name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-client:
    name: Build client (React/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

  build-server:
    name: Build server (Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The server has no build/lint script and its "test" script starts a
      # long-running dev server (nodemon), so it is not usable in CI.
      # Validate that every source file at least parses without syntax errors.
      - name: Syntax check
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -print \
            | xargs -r -n1 node --check
